<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Pilot</title>
<style>
:root{--navy:#071321;--panel:#102238;--panel2:#14283d;--edge:#38516c;--muted:#9bb0c5;--mint:#8fe0b4;--white:#eff6ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);color:var(--white);font-family:Inter,system-ui,-apple-system,sans-serif}#game{position:absolute;inset:0;background:#0b1726}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.ui{position:absolute;inset:0;pointer-events:none}.header{height:76px;position:absolute;top:0;left:0;right:0;background:linear-gradient(90deg,#0e1e31f5,#14253af0);border-bottom:1px solid #314762;display:flex;align-items:center;justify-content:space-between;padding:0 18px;pointer-events:auto}.logo{font-weight:900;letter-spacing:.16em;font-size:17px;color:#e9f2fc}.logo em{font-style:normal;color:var(--mint)}.money{display:flex;gap:8px}.chip{border:1px solid #344b67;background:#13263b;border-radius:25px;padding:8px 13px;font-weight:700;font-size:13px;white-space:nowrap}.airport-card,.view-card{position:absolute;top:94px;background:#102238eF;border:1.5px solid #4a617c;border-radius:16px;box-shadow:0 10px 24px #02091255;padding:13px 16px;pointer-events:auto}.airport-card{left:16px;width:min(265px,47vw)}.airport-card .state{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--mint);text-transform:uppercase}.airport-card h1{font-size:18px;line-height:1.1;margin:5px 0 4px}.airport-card p{margin:0;color:#a5bbd0;font-size:13px}.view-card{right:16px;min-width:160px}.viewbtn{border:1px solid #516984;border-radius:10px;background:#1d344c;color:#dce9f7;padding:8px 12px;font-size:12px;pointer-events:auto}.time{font-size:18px;font-weight:800;margin:7px 0 2px}.sub{font-size:12px;color:#9fb5c9}.stats{position:absolute;left:16px;right:16px;bottom:95px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;pointer-events:none}.stat{background:#102238f2;border:1.5px solid #4a617c;border-radius:13px;text-align:center;padding:10px 4px 8px;box-shadow:0 8px 20px #030a1250}.stat label{font-size:10px;letter-spacing:.17em;color:#9bb0c5}.stat strong{display:block;font-size:21px;margin:3px 0 1px}.stat small{font-size:10px;color:#a8bed2}.nav{position:absolute;bottom:0;left:0;right:0;height:84px;background:#0c1a2bf5;border-top:1px solid #263c54;display:grid;grid-template-columns:repeat(5,1fr);pointer-events:auto}.nav button{border:0;background:none;color:#8fa6bc;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-size:11px}.nav button .ico{font-size:22px;filter:saturate(.75)}.nav button.active{background:#18334b;color:var(--mint)}.nav button.active .ico{filter:none}.panel{position:absolute;left:12px;right:12px;bottom:92px;max-height:45vh;overflow:auto;background:#0f2237f7;border:1px solid #3c5570;border-radius:15px;padding:14px;display:none;pointer-events:auto;box-shadow:0 15px 35px #02071180}.panel.show{display:block}.panel h2{margin:0 0 10px;font-size:16px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px;border:1px solid #29415b;background:#142b42;border-radius:10px;margin:7px 0;font-size:13px}.item small{display:block;color:#99b0c6;margin-top:3px}.action{border:1px solid #55708b;background:#1b3550;color:#eaf4ff;border-radius:9px;padding:8px 10px;font-weight:700;font-size:12px}.action.primary{background:#276e9c;border-color:#4e9bc6}.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#10253aeF;border:1px solid #4b6580;border-radius:12px;padding:12px 18px;font-size:13px;display:none;pointer-events:none}.toast.show{display:block}.maplabel{position:absolute;bottom:185px;left:50%;transform:translateX(-50%);font-size:11px;color:#d0e0ef;background:#102238bd;border:1px solid #314963;border-radius:9px;padding:7px 11px;pointer-events:none;white-space:nowrap}
@media(max-width:500px){.header{height:70px;padding:0 13px}.logo{font-size:15px}.chip{padding:7px 9px;font-size:11px}.airport-card,.view-card{top:82px;padding:11px 12px}.airport-card{left:10px;width:calc(50% - 18px)}.airport-card h1{font-size:16px}.airport-card p{font-size:11px}.view-card{right:10px;min-width:0;width:calc(50% - 18px);text-align:left}.viewbtn{font-size:10px;padding:7px 9px}.time{font-size:16px}.sub{font-size:11px}.stats{left:10px;right:10px;bottom:94px;gap:5px}.stat{padding:8px 2px}.stat label{font-size:9px}.stat strong{font-size:19px}.nav{height:82px}.nav button{font-size:10px}.nav button .ico{font-size:21px}.maplabel{bottom:184px}}
</style></head><body><div id="game"><canvas id="world"></canvas></div><div class="ui">
<header class="header"><div class="logo">POCKET <em>PILOT</em></div><div class="money"><div class="chip">💵 <span id="cash">2,500</span></div><div class="chip">✈ <span id="hours">0.0</span>h</div></div></header>
<div class="airport-card"><div class="state" id="state">TAXIING · KFRG</div><h1>Republic Airport</h1><p>Long Island · New York</p></div><div class="view-card"><button class="viewbtn" id="view">VIEW · FOLLOW</button><div class="time" id="clock">23:17</div><div class="sub">LOCAL · VFR</div></div>
<div class="maplabel" id="hint">Drag to look around · tap View to change camera</div><div class="stats"><div class="stat"><label>IAS</label><strong id="ias">18</strong><small>KT</small></div><div class="stat"><label>ALTITUDE</label><strong id="alt">0</strong><small>FT</small></div><div class="stat"><label>HEADING</label><strong id="hdg">140</strong><small>°</small></div></div>
<nav class="nav"><button class="active" data-tab="airport"><span class="ico">▦</span>Airport</button><button data-tab="jobs"><span class="ico">▤</span>Jobs</button><button data-tab="map"><span class="ico">🗺</span>Map</button><button data-tab="fleet"><span class="ico">✈</span>Fleet</button><button data-tab="career"><span class="ico">🎓</span>Career</button></nav><div class="panel" id="panel"></div><div class="toast" id="toast"></div></div>
<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');let W,H,dpr,cam=0,phase='TAXIING',planeX=0,planeY=0,heading=140,speed=18,alt=0,cash=2500,flightHours=0,activeTab='airport',drag=false,lastX=0,lastY=0,panX=0,panY=0,scale=1,prop=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function poly(points,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let p of points.slice(1))ctx.lineTo(p[0],p[1]);ctx.closePath();ctx.fill()}function line(x1,y1,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawBuilding(x,base,w,h,seed){rect(x,base-h,w,h,'#1b2e3d');for(let row=0;row<h-7;row+=7)for(let col=3;col<w-3;col+=6){if((row+col+seed)%4!==0)rect(x+col,base-h+row,2.5,3,((row*col+seed)%3===0)?'#42525b':'#334751')}}
function drawSky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101e37');g.addColorStop(.43,'#304a69');g.addColorStop(.66,'#455c70');g.addColorStop(1,'#182a34');rect(0,0,W,H,'#122238');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let horizon=H*.49;ctx.fillStyle='#8b8790';ctx.globalAlpha=.14;ctx.beginPath();ctx.arc(W*.75,horizon-95,95,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;rect(W*.74,horizon-12,18,44,'#d5a76e');rect(W*.74+3,horizon-6,9,28,'#f0cf9c')}
function drawCity(){let horizon=H*.49,base=horizon+12;rect(0,horizon,W,H*.1,'#1a3334');let seed=17;for(let x=-5;x<W+20;){let w=16+(seed*7%25),h=48+(seed*19%115);drawBuilding(x,base,w,h,seed);x+=w+2;seed++}rect(0,base,W,10,'#172e32')}
function drawGround(){let horizon=H*.50;rect(0,horizon,W,H-horizon,'#18332f');for(let i=0;i<160;i++){let x=(i*73+23)%W,y=horizon+((i*47)%Math.max(1,H-horizon));rect(x,y,9+(i%4)*6,4,'#24433b')}
// apron/terminal on left
poly([[W*.07,horizon+H*.13],[W*.36,horizon+H*.1],[W*.45,horizon+H*.24],[W*.19,horizon+H*.31]],'#344656');poly([[W*.07,horizon+H*.13],[W*.36,horizon+H*.1],[W*.36,horizon+H*.14],[W*.12,horizon+H*.17]],'#718394');poly([[W*.19,horizon+H*.31],[W*.45,horizon+H*.24],[W*.43,horizon+H*.26],[W*.16,horizon+H*.34]],'#263b4c');for(let i=0;i<8;i++){let x=W*.11+i*W*.033,y=horizon+H*.14-i*H*.004;rect(x,y,6,5,'#c4c7a5');rect(x+7,y+1,3,4,'#e3c06c')}
// small hangars and apron objects
poly([[W*.69,horizon+H*.12],[W*.82,horizon+H*.12],[W*.82,horizon+H*.18],[W*.69,horizon+H*.18]],'#273a4c');rect(W*.7,horizon+H*.125,W*.11,H*.045,'#7194a8');rect(W*.83,horizon+H*.18,W*.075,H*.07,'#293a49');
// runway perspective, taper from foreground
let cx=W*.52,top=horizon+H*.04,bot=H*.94,topw=W*.12,botw=W*.46;poly([[cx-topw,top],[cx+topw,top],[cx+botw,bot],[cx-botw,bot]],'#303844');poly([[cx-topw-5,top],[cx+topw+5,top],[cx+botw+8,bot],[cx-botw-8,bot]],'#57616b');poly([[cx-topw,top],[cx+topw,top],[cx+botw,bot],[cx-botw,bot]],'#303844');
// dashed center markings perspective
for(let i=0;i<12;i++){let t=i/12,y=top+(bot-top)*t,w=topw+(botw-topw)*t,markH=3+15*t,markW=2+7*t;rect(cx-markW/2,y,markW,markH,'#e6e8e6')}
for(let side of [-1,1]){for(let i=0;i<10;i++){let t=i/10,y=top+(bot-top)*t,w=topw+(botw-topw)*t;rect(cx+side*(w*.72),y,3+5*t,5+12*t,'#e5d06b');rect(cx+side*(w*.86),y,2+3*t,4+9*t,'#d9dce0')};for(let i=0;i<8;i++){let t=i*.011,y=top+H*.025+i*H*.007;rect(cx+side*(topw*.7),y,3,2,'#f5e7b6')}}
// taxiway curves as tapered lane
poly([[W*.22,H*.87],[W*.27,H*.83],[W*.42,horizon+H*.22],[W*.48,horizon+H*.18],[W*.49,horizon+H*.2],[W*.35,H*.82],[W*.30,H*.88]],'#3c464e');line(W*.24,H*.86,W*.45,horizon+H*.22,'#d8bb56',2);line(W*.27,H*.85,W*.47,horizon+H*.21,'#d8bb56',2);
// runway edge lights, taxiway lamps
for(let i=0;i<22;i++){let t=i/22,y=top+(bot-top)*t,w=topw+(botw-topw)*t;let s=1+2*t;rect(cx-w-3*s,y,2*s,3*s,'#efc969');rect(cx+w+1*s,y,2*s,3*s,'#efc969')}
// parked mini planes on apron
for(let i=0;i<4;i++){drawPlane(W*.15+i*W*.045,horizon+H*.23+(i%2)*H*.018,0.45,'#d8e1e6',-0.3)}
// player
let py=H*.72+planeY,px=W*.36+planeX;drawPlane(px,py,1.05,'#e9eef0',0);rect(px-2,py-20,4,6,'#e74e52');
}
function drawPlane(x,y,s,color,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s); // shadow
poly([[-23,6],[0,12],[25,6],[5,14],[-15,12]],'#08141a66'); // fuselage stylized top view
poly([[-4,-21],[4,-21],[7,-6],[7,6],[5,15],[2,19],[-2,19],[-5,15],[-7,6],[-7,-6]],color);poly([[-5,-5],[-28,3],[-29,7],[-8,5],[8,5],[29,7],[28,3],[5,-5]],'#d3dce3');poly([[-3,12],[-12,18],[-13,21],[-3,18],[3,18],[13,21],[12,18],[3,12]],'#c8d3dc');poly([[-2,-17],[0,-22],[2,-17]],'#b4c5d0');rect(-1,-20,2,4,'#233746');rect(-2,-1,4,3,'#718da2');ctx.restore()}
function render(){drawSky();drawCity();drawGround();requestAnimationFrame(render)}render();
// mouse/touch look-around is deliberately simple, shifting scenery a little like a parallax pan
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;planeX+=dx*.22;planeY+=dy*.14;planeX=Math.max(-W*.16,Math.min(W*.16,planeX));planeY=Math.max(-H*.12,Math.min(H*.12,planeY))});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
const viewModes=['FOLLOW','TOWER','COCKPIT','MAP'];document.getElementById('view').onclick=()=>{cam=(cam+1)%viewModes.length;document.getElementById('view').textContent='VIEW · '+viewModes[cam];toast('Camera: '+viewModes[cam]);if(cam===2){document.getElementById('hint').textContent='Cockpit view selected · use flight controls';}else document.getElementById('hint').textContent='Drag to look around · tap View to change camera'};
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}function setPhase(p){phase=p;document.getElementById('state').textContent=p+' · KFRG'}
const panel=document.getElementById('panel');function openTab(tab){activeTab=tab;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));panel.classList.remove('show');if(tab==='airport'){toast('Republic Airport · KFRG');return}panel.classList.add('show');let content='';if(tab==='jobs')content='<h2>Available flights</h2><div class="item"><div><b>Local scenic · Montauk</b><small>35 min · 120 nm · VFR</small></div><button class="action primary" onclick="acceptJob()">ACCEPT</button></div><div class="item"><div><b>Passenger · Newark</b><small>48 min · 95 nm · 2 passengers</small></div><button class="action" onclick="acceptJob()">ACCEPT</button></div><div class="item"><div><b>Training · Pattern work</b><small>3 circuits · 45 min</small></div><button class="action" onclick="acceptJob()">FLY</button></div>';if(tab==='map')content='<h2>Flight planning map</h2><div class="item"><div><b>KFRG → KJFK</b><small>Republic to John F. Kennedy · 14 nm</small></div><button class="action primary" onclick="toast(\'Route selected\')">SELECT</button></div><div class="item"><div><b>KFRG → KISP</b><small>Republic to Long Island MacArthur · 30 nm</small></div><button class="action" onclick="toast(\'Route selected\')">SELECT</button></div><div class="item"><div><b>KFRG → KHPN</b><small>Republic to Westchester · 22 nm</small></div><button class="action" onclick="toast(\'Route selected\')">SELECT</button></div>';if(tab==='fleet')content='<h2>Hangar · Aircraft</h2><div class="item"><div><b>Cessna 172 Skyhawk</b><small>N960WC · Owned · 4 seats</small></div><button class="action primary" onclick="toast(\'Aircraft selected\')">SELECT</button></div><div class="item"><div><b>Piper PA-28 Archer III</b><small>Unlock · 12,000 credits</small></div><button class="action" onclick="toast(\'Not enough credits\')">LOCKED</button></div>';if(tab==='career')content='<h2>Pilot career</h2><div class="item"><div><b>Student Pilot</b><small>0.0 hours · First solo complete</small></div><span>✈</span></div><div class="item"><div><b>Next qualification</b><small>Complete 5 pattern circuits and 3 cross-country flights</small></div><button class="action" onclick="toast(\'Training progress saved\')">VIEW</button></div>';panel.innerHTML=content}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));window.acceptJob=()=>{toast('Job accepted · Flight plan ready');setPhase('FLIGHT PLAN')};
// Sim state controls are exposed in Airport panel as compact controls
openTab('airport');document.getElementById('view').onclick=document.getElementById('view').onclick;
let clickCount=0;document.querySelector('.airport-card').onclick=()=>{panel.classList.add('show');panel.innerHTML='<h2>Airport operations · KFRG</h2><div class="item"><div><b>Start engine</b><small>Preflight complete · ready on ramp</small></div><button class="action primary" id="eng">START</button></div><div class="item"><div><b>Taxi</b><small>Follow centerline to runway 14</small></div><button class="action" id="tax">TAXI</button></div><div class="item"><div><b>Takeoff</b><small>Runway 14 · departure heading 140°</small></div><button class="action primary" id="to">TAKEOFF</button></div><div class="item"><div><b>Reset</b><small>Return aircraft to ramp</small></div><button class="action" id="rs">RESET</button></div>';document.getElementById('eng').onclick=()=>{toast('Engine started');setPhase('ENGINE RUNNING')};document.getElementById('tax').onclick=()=>{speed=18;setPhase('TAXIING');toast('Taxi · follow centerline')};document.getElementById('to').onclick=()=>{setPhase('TAKEOFF');speed=82;alt=500;toast('Takeoff · airborne');};document.getElementById('rs').onclick=()=>{speed=0;alt=0;planeX=0;planeY=0;setPhase('PARKED');toast('Aircraft reset to ramp')}};
setInterval(()=>{if(phase==='TAKEOFF'||phase==='AIRBORNE'){alt=Math.min(3500,alt+25);speed=Math.max(82,Math.min(110,speed));phase='AIRBORNE';document.getElementById('state').textContent='AIRBORNE · KFRG';planeY-=.1}else if(phase==='TAXIING'){speed=18}document.getElementById('ias').textContent=speed;document.getElementById('alt').textContent=Math.round(alt);document.getElementById('hdg').textContent=heading;document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('cash').textContent=cash.toLocaleString();document.getElementById('hours').textContent=flightHours.toFixed(1)},1000);
</script></body></html>
