<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Pilot · Flight Career</title>
<style>
:root{--ink:#eaf3ff;--muted:#9cb2c8;--panel:#101d2c;--panel2:#1c3045;--stroke:#38536b;--mint:#8be6b0;--gold:#f3c876;--red:#ff817d}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#09111d;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{height:100dvh;display:flex;flex-direction:column}.topbar{height:55px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:linear-gradient(90deg,#0d1928,#15273a);border-bottom:1px solid #293e54;z-index:3}.brand{font-weight:950;letter-spacing:.12em;font-size:14px}.brand span{color:var(--mint)}.topstats{display:flex;gap:6px}.chip{border:1px solid #324b64;background:#17293d;border-radius:99px;padding:5px 9px;font-size:11px;color:#dce9f7}.chip b{color:white}.scene{position:relative;flex:1;min-height:0;overflow:hidden;background:#0c1827}canvas{display:block;width:100%;height:100%}.topHUD{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hudbox{background:linear-gradient(135deg,#0b1727eF,#14283be8);border:1px solid #476078;border-radius:10px;padding:8px 10px;box-shadow:0 5px 18px #0005;font-size:11px;backdrop-filter:blur(8px)}.hudbox strong{font-size:15px;display:block}.phase{color:var(--mint);font-weight:850;letter-spacing:.08em}.right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}.camera{pointer-events:auto;border:1px solid #46637d;background:#243b52;color:#eaf3ff;border-radius:7px;padding:6px 9px;font-size:11px}.bottomHUD{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:7px;pointer-events:none}.instrument{flex:1;text-align:center;padding:7px 4px}.instrument small{color:#91abc2;font-size:10px;letter-spacing:.1em}.instrument strong{font-size:18px;line-height:1.1}.instrument .unit{font-size:10px;color:#c1d3e5}.nav{height:66px;flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#101d2d;border-top:1px solid #2d4259;z-index:4}.nav button{border:0;background:transparent;color:#8da5bd;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button.active{color:var(--mint);background:linear-gradient(0deg,#1d3549,#14283a)}.nav .icon{font-size:20px}.overlay{position:absolute;inset:0;background:#06101cc0;display:none;align-items:flex-end;z-index:5;backdrop-filter:blur(3px)}.overlay.open{display:flex}.sheet{width:100%;max-height:82%;overflow:auto;background:linear-gradient(160deg,#192c40,#101e2e);border:1px solid #415b74;border-radius:18px 18px 0 0;padding:15px 14px 24px;box-shadow:0 -15px 40px #0007}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheethead h2{margin:0;font-size:18px}.close{border:1px solid #476079;background:#2a4056;color:#fff;border-radius:8px;padding:7px 11px}.card{background:linear-gradient(145deg,#132439,#0f1c2b);border:1px solid #344c63;border-radius:12px;padding:12px;margin:9px 0}.muted{font-size:12px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{background:#293f56;border:1px solid #46637c;color:#edf5ff;border-radius:9px;padding:10px 12px;font:inherit}.btn.primary{background:linear-gradient(135deg,#277d57,#36996b);border-color:#64c391;font-weight:850}.btn.full{width:100%}.btn:active{filter:brightness(1.18)}select{width:100%;background:#243b52;color:#fff;border:1px solid #47637d;border-radius:9px;padding:10px;margin:8px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini{background:#20354a;border-radius:8px;padding:8px}.mini small{display:block;color:#91abc1;font-size:10px}.mini b{font-size:14px}.route{font-family:monospace;font-size:17px;color:var(--mint);font-weight:850}.progress{height:7px;background:#314a61;border-radius:9px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#68c58e,#b4f0c8)}.log{padding:7px 0;border-bottom:1px solid #2b4054;font-size:12px;color:#b9cbdc}#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;z-index:9;background:#122438;border:1px solid #64819b;padding:12px 16px;border-radius:10px;max-width:85%;text-align:center;box-shadow:0 12px 32px #0008}.controlbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.controlbar .btn{min-height:48px}.hint{font-size:11px;color:#93aac0;line-height:1.5}@media(min-width:760px){.sheet{max-width:620px;margin:0 auto 14px;border-radius:18px}.overlay{align-items:center}.topbar{height:60px}.nav{max-width:900px;width:100%;margin:auto}}
</style></head><body><div id="app"><header class="topbar"><div class="brand">POCKET <span>PILOT</span></div><div class="topstats"><span class="chip">💵 <b id="cash">2,500</b></span><span class="chip">✈ <b id="hours">0.0</b>h</span></div></header><main class="scene" id="scene"><canvas id="world"></canvas><div class="topHUD"><div class="hudbox"><div class="phase" id="phase">ON RAMP · KFRG</div><strong id="airport">Republic Airport</strong><span class="muted">Long Island · New York</span></div><div class="right"><div class="hudbox"><button class="camera" id="camera">VIEW · FOLLOW</button><strong id="time">18:09</strong><span class="muted">LOCAL · VFR</span></div></div></div><div class="bottomHUD"><div class="hudbox instrument"><small>IAS</small><br><strong id="speed">0</strong> <span class="unit">KT</span></div><div class="hudbox instrument"><small>ALTITUDE</small><br><strong id="alt">0</strong> <span class="unit">FT</span></div><div class="hudbox instrument"><small>HEADING</small><br><strong id="heading">140</strong><span class="unit">°</span></div></div><div class="overlay" id="overlay"><div class="sheet"><div class="sheethead"><h2 id="title">Menu</h2><button class="close" id="close">✕</button></div><div id="content"></div></div></div><div id="toast"></div></main><nav class="nav"><button data-menu="airport" class="active"><span class="icon">🏢</span>Airport</button><button data-menu="jobs"><span class="icon">📑</span>Jobs</button><button data-menu="map"><span class="icon">🗺</span>Map</button><button data-menu="fleet"><span class="icon">🛩</span>Fleet</button><button data-menu="career"><span class="icon">🎓</span>Career</button></nav></div>
<script>
(()=>{const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');let W=0,H=0,D=1,cam=0,phase='PARKED',speed=0,alt=0,hdg=140,throttle=0,turn=0,plan=false,ap=false,routeT=0,dest='KISP',cash=2500,hours=0,flights=0,logs=['Welcome to Republic Airport.'],toastTimer=0,weather=0;const airports={KISP:{name:'Long Island MacArthur',nm:18,hdg:105},KHPN:{name:'Westchester County',nm:42,hdg:315},KJFK:{name:'John F. Kennedy Intl',nm:16,hdg:190},KBDR:{name:'Bridgeport',nm:48,hdg:330},KBOS:{name:'Boston Logan',nm:145,hdg:55},KALB:{name:'Albany Intl',nm:120,hdg:330}};
function resize(){let r=$('scene').getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',1900)}function log(s){logs.unshift(s);logs=logs.slice(25)}function update(){ $('cash').textContent=cash.toLocaleString();$('hours').textContent=hours.toFixed(1);$('speed').textContent=Math.round(speed);$('alt').textContent=Math.round(alt).toLocaleString();$('heading').textContent=Math.round((hdg+360)%360);let p={PARKED:'ON RAMP',TAXI:'TAXIING',TAKEOFF:'TAKEOFF',CRUISE:'EN ROUTE',APPROACH:'APPROACH',LANDING:'LANDING'};$('phase').textContent=(p[phase]||phase)+' · '+(phase==='CRUISE'?dest:'KFRG');$('airport').textContent=phase==='CRUISE'?'En route · '+dest:phase==='APPROACH'||phase==='LANDING'?airports[dest].name:'Republic Airport';$('camera').textContent='VIEW · '+['FOLLOW','COCKPIT','TOWER','MAP'][cam];let t=new Date();$('time').textContent=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')}
function summary(){let a=airports[dest];return `<div class="grid3"><div class="mini"><small>ROUTE</small><b>KFRG → ${dest}</b></div><div class="mini"><small>DISTANCE</small><b>${a.nm} NM</b></div><div class="mini"><small>CRUISE</small><b>3,500 FT</b></div></div><p class="muted">VFR · Estimated ${Math.max(8,Math.round(a.nm/2.5))} min · ${Math.ceil(a.nm/4+4)} gal fuel</p>`}function close(){ $('overlay').classList.remove('open');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.menu==='airport'))}function open(m){$('overlay').classList.add('open');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.menu===m));let title='',html='';if(m==='airport'){title='Airport';html=`<div class="card"><div class="row"><b>Republic Airport · KFRG</b><span class="muted">HOME BASE</span></div><p class="muted">Your home airport. Plan a flight, taxi out, take off, fly, land, and park to earn your pilot career progress.</p><button class="btn primary full" onclick="window.openMenu('jobs')">Browse flight jobs</button><button class="btn full" style="margin-top:8px" onclick="window.controls()">Aircraft controls</button></div><div class="card"><b>Airport conditions</b><div class="grid3"><div class="mini"><small>WIND</small><b>140° · 4 kt</b></div><div class="mini"><small>VISIBILITY</small><b>10 SM</b></div><div class="mini"><small>RUNWAY</small><b>14 / 32</b></div></div><p class="muted">Clear · VFR · No precipitation</p></div>`}if(m==='jobs'){title='Flight Contracts';html=`<div class="card"><div class="row"><b>✦ Local scenic charter</b><b style="color:var(--gold)">+$500 base</b></div><p class="muted">Beginner VFR contract. Flight completion earns additional distance pay and logbook time.</p><label class="muted">Destination airport</label><select id="dest">${Object.entries(airports).map(([k,a])=>`<option value="${k}" ${dest===k?'selected':''}>${k} · ${a.name} · ${a.nm} NM</option>`).join('')}</select><button class="btn full" onclick="window.selectDest()">Choose destination</button></div><div class="card"><b>Flight briefing</b><div id="brief">${plan?summary():'No flight plan filed yet.'}</div><button class="btn primary full" onclick="window.makePlan()">GENERATE FLIGHT PLAN</button></div><div class="card"><b>Flight actions</b><p class="muted">Control the aircraft using on-screen buttons or keyboard. Tap once to engage, again to release.</p><div class="controlbar"><button class="btn" onclick="window.setTurn(-1)">↶ LEFT</button><button class="btn primary" onclick="window.setPower(1)">▲ POWER</button><button class="btn" onclick="window.setTurn(1)">RIGHT ↷</button><button class="btn" onclick="window.setPower(-1)">▼ BRAKE</button><button class="btn" onclick="window.rotate()">ROTATE</button><button class="btn" onclick="window.toggleAP()">AUTOPILOT</button></div><button class="btn primary full" style="margin-top:9px" onclick="window.advance()">${phase==='PARKED'?'BEGIN TAXI':phase==='TAXI'?'LINE UP · TAKEOFF':phase==='TAKEOFF'?'CLIMB · CRUISE':phase==='CRUISE'?'BEGIN APPROACH':phase==='APPROACH'?'LANDING':'PARK & COMPLETE'}</button><p class="hint">Keyboard: W / ↑ power · S / ↓ brake · A/D steer · Space rotate · P autopilot.</p></div>`}if(m==='map'){title='Route Map';html=`<div class="card"><b>${plan?'KFRG → '+dest:'Route not filed'}</b><p class="muted">${plan?airports[dest].nm+' nautical miles · VFR flight':'Generate a flight plan from the Jobs menu.'}</p><div style="height:220px;border-radius:10px;overflow:hidden;background:#142b38"><svg viewBox="0 0 400 220" width="100%" height="100%"><defs><linearGradient id="land" x2="0" y2="1"><stop stop-color="#24433d"/><stop offset="1" stop-color="#172d2c"/></linearGradient></defs><rect width="400" height="220" fill="url(#land)"/><path d="M-20 70 Q60 100 110 62 T220 75 T430 55 M-10 155 Q90 115 140 150 T300 140 T430 175" fill="none" stroke="#31535c" stroke-width="18"/><path d="M40 0 L75 220 M180 0 L160 220 M330 0 L300 220" stroke="#2b4b4a" stroke-width="6"/><path d="M65 38 L130 92 L260 130 L340 65" fill="none" stroke="#e3b867" stroke-dasharray="4 6" stroke-width="2"/><circle cx="65" cy="38" r="6" fill="#8be6b0"/><circle cx="340" cy="65" r="6" fill="#ffd27b"/><text x="75" y="30" fill="white" font-size="12">KFRG</text><text x="347" y="60" fill="white" font-size="12">${dest}</text><g fill="#a3c4b2" opacity=".7"><circle cx="105" cy="48" r="2"/><circle cx="150" cy="180" r="2"/><circle cx="260" cy="45" r="2"/><circle cx="290" cy="105" r="2"/></g></svg></div><button class="btn full" onclick="window.openMenu('jobs')">Edit flight plan</button></div><p class="hint">Map artwork is illustrative. Future versions can add map tiles, real airport layouts, and navigational fixes.</p>`}if(m==='fleet'){title='Hangar';html=`<div class="card"><div class="row"><b>🛩️ Pocket 100 · Trainer</b><span style="color:var(--mint)">OWNED</span></div><p class="muted">Single-engine · 4 seats · 105 kt cruise · 500 NM range</p><div class="grid3"><div class="mini"><small>CONDITION</small><b>100%</b></div><div class="mini"><small>FUEL</small><b>36 gal</b></div><div class="mini"><small>STATUS</small><b>${phase==='CRUISE'?'AIRBORNE':'READY'}</b></div></div></div><div class="card"><b>Aircraft progression</b><div class="row" style="margin:10px 0"><span>Cessna-style trainer</span><span>${hours>=10?'UNLOCKED':'10 hours'}</span></div><div class="progress"><i style="width:${Math.min(100,hours/10*100)}%"></i></div><div class="row"><span>Twin engine</span><span>${hours>=40?'UNLOCKED':'40 hours'}</span></div><div class="progress"><i style="width:${Math.min(100,hours/40*100)}%"></i></div><p class="muted">Earn flight hours and complete license requirements to expand your fleet.</p></div>`}if(m==='career'){title='Pilot Career';html=`<div class="card"><b>Student Pilot</b><p class="muted">Build experience, complete training tasks, and qualify for the next certificate.</p><div class="row"><span>Flight hours toward PPL</span><b>${hours.toFixed(1)} / 40.0</b></div><div class="progress"><i style="width:${Math.min(100,hours/40*100)}%"></i></div></div><div class="card"><b>Certificates & ratings</b>${[['Student Pilot','CURRENT'],['Private Pilot · PPL','40 hrs + checkride'],['Instrument · IFR','PPL + training'],['Commercial','250 hrs + checkride'],['Multi-engine','Training + checkride']].map((x,i)=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #2a4156"><span>${x[0]}</span><span class="muted">${i===0?'ACTIVE':i===1&&hours>=40?'READY':x[1]}</span></div>`).join('')}</div><div class="card"><b>Logbook</b><div class="grid3"><div class="mini"><small>FLIGHTS</small><b>${flights}</b></div><div class="mini"><small>TIME</small><b>${hours.toFixed(1)} h</b></div><div class="mini"><small>EARNINGS</small><b>$${cash.toLocaleString()}</b></div></div><button class="btn full" style="margin-top:8px" onclick="window.showLog()">Open logbook entries</button></div>`}$('title').textContent=title;$('content').innerHTML=html}window.openMenu=open;window.selectDest=()=>{dest=$('dest').value;plan=false;toast('Destination selected');open('jobs')};window.makePlan=()=>{plan=true;log('Filed VFR plan KFRG → '+dest+' · '+airports[dest].nm+' NM');toast('Flight plan generated');open('jobs')};window.setPower=v=>{throttle=throttle===v?0:v;turn=0;toast(throttle?'Power engaged':'Control released')};window.setTurn=v=>{turn=turn===v?0:v;throttle=0};window.toggleAP=()=>{if(phase!=='CRUISE'){toast('Autopilot available en route');return}ap=!ap;toast(ap?'Autopilot engaged':'Autopilot disengaged');log(ap?'Autopilot engaged':'Autopilot disengaged')};window.rotate=()=>{if(phase==='TAKEOFF'&&speed>=50){phase='CRUISE';speed=105;alt=3500;routeT=0;log('Rotate · airborne');toast('Airborne!')}else if(phase==='APPROACH'){alt=Math.max(200,alt-100)}else if(phase==='LANDING'){alt=0;speed=Math.max(0,speed-3)}else toast('Rotate when above 50 kt');update()};window.advance=()=>{if(phase==='PARKED'){if(!plan){toast('File a flight plan first');open('jobs');return}phase='TAXI';log('Taxi to runway 14');toast('Taxi · use throttle and steering')}else if(phase==='TAXI'){if(speed<4){toast('Taxi forward first');return}phase='TAKEOFF';speed=0;log('Holding short runway 14');toast('Line up · takeoff roll')}else if(phase==='TAKEOFF'){if(speed<50){toast('Accelerate to 50 kt before rotate');return}window.rotate()}else if(phase==='CRUISE'){phase='APPROACH';ap=false;alt=1500;speed=90;log('Arrival · approach phase');toast('Approach · take controls')}else if(phase==='APPROACH'){phase='LANDING';alt=180;speed=65;log('Final approach');toast('Landing · flare and slow')}else if(phase==='LANDING'){if(speed>20){toast('Brake below 20 kt to park');return}phase='PARKED';speed=0;alt=0;cash+=500+airports[dest].nm*4;hours+=Math.max(.25,airports[dest].nm/65);flights++;plan=false;ap=false;log('Flight complete · payment credited');toast('Flight complete! +$'+(500+airports[dest].nm*4))}update();if($('overlay').classList.contains('open'))open('jobs')};window.controls=()=>open('jobs');window.showLog=()=>{open('career');$('content').innerHTML='<div class="card"><b>Flight Log</b>'+logs.map(x=>`<div class="log">${x}</div>`).join('')+'</div>'};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>open(b.dataset.menu));$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('camera').onclick=()=>{cam=(cam+1)%4;update()};addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','arrowup'].includes(k))throttle=1;if(['s','arrowdown'].includes(k))throttle=-1;if(['a','arrowleft'].includes(k))turn=-1;if(['d','arrowright'].includes(k))turn=1;if(k===' '&&phase==='TAKEOFF'&&speed>=50)window.rotate();if(k==='p')window.toggleAP()});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['w','arrowup','s','arrowdown'].includes(k))throttle=0;if(['a','arrowleft','d','arrowright'].includes(k))turn=0});
// Canvas art: layered dusk atmosphere, city blocks, terminal, apron, runway markings, lights, aircraft and moving ground traffic.
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let p of points.slice(1))ctx.lineTo(p[0],p[1]);ctx.closePath();ctx.fill()}function line(points,color,width,dash=[]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let p of points.slice(1))ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.setLineDash([])}function building(x,y,w,h,seed){poly([[x,y],[x+w,y-3],[x+w,y+h],[x,y+h+4]],'#182a39');poly([[x,y],[x+w*.28,y-6],[x+w,y-3],[x+w*.7,y+3]],'#405263');ctx.fillStyle='#e6b86a';for(let j=0;j<Math.floor(w/9);j++)for(let i=0;i<Math.floor(h/10);i++){if((j*7+i*3+seed)%4!==0)ctx.fillRect(x+4+j*9,y+5+i*10,3,3)}}function draw(){ctx.clearRect(0,0,W,H);let time=performance.now()*.00005;let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#101d3a');sky.addColorStop(.34,'#304b68');sky.addColorStop(.58,'#bf8269');sky.addColorStop(.7,'#283943');sky.addColorStop(1,'#122322');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let sunX=W*.76,sunY=H*.29;ctx.fillStyle='#f4c47a22';ctx.beginPath();ctx.arc(sunX,sunY,Math.min(W,H)*.16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5d19a';ctx.beginPath();ctx.arc(sunX,sunY,Math.min(W,H)*.035,0,Math.PI*2);ctx.fill();
// distant layered hills and skyline silhouettes
poly([[0,H*.39],[W*.12,H*.34],[W*.2,H*.38],[W*.35,H*.31],[W*.48,H*.37],[W*.6,H*.33],[W*.73,H*.4],[W*.86,H*.34],[W,H*.38],[W,H],[0,H]],'#23353a');for(let i=0;i<95;i++){let x=i*W/95,base=H*.4+(Math.sin(i*.7)*H*.025);let bw=5+(i*17%15),bh=10+(i*23%(H*.14));ctx.fillStyle=i%3===0?'#20313c':'#1b2b35';ctx.fillRect(x,base-bh,bw,bh);for(let yy=base-bh+4;yy<base-3;yy+=6)for(let xx=x+2;xx<x+bw-1;xx+=5){ctx.fillStyle=(i+Math.floor(yy))%4===0?'#efbf6a55':'#f4d49a28';ctx.fillRect(xx,yy,2,2)}}
// textured airport ground polygons
poly([[0,H*.43],[W,H*.4],[W,H],[0,H]],'#1b302d');for(let i=0;i<160;i++){let x=(i*127.4%W),y=H*.43+(i*83.1%(H*.57));let ww=7+i%18,hh=3+i%7;ctx.fillStyle=i%2?'#284039':'#223a34';ctx.fillRect(x,y,ww,hh)}
// runway: perspective aligned, shoulder and centerline
let runwayX=W*.52,top=H*.43,bottom=H*1.08,rwTop=Math.max(24,W*.055),rwBottom=Math.max(100,W*.3);poly([[runwayX-rwTop,top],[runwayX+rwTop,top],[runwayX+rwBottom,bottom],[runwayX-rwBottom,bottom]],'#202b37');poly([[runwayX-rwTop*.78,top],[runwayX+rwTop*.78,top],[runwayX+rwBottom*.8,bottom],[runwayX-rwBottom*.8,bottom]],'#333f4b');line([[runwayX-rwTop,top],[runwayX-rwBottom,bottom]],'#738291',1);line([[runwayX+rwTop,top],[runwayX+rwBottom,bottom]],'#738291',1);for(let i=0;i<30;i++){let f=i/30,y=top+f*(bottom-top),width=rwTop+f*(rwBottom-rwTop);let markW=2+f*5,markH=2+f*13;ctx.fillStyle=i%3===0?'#dce4e9':'#f2d276';ctx.fillRect(runwayX-width*.7,y,markW,markH);ctx.fillRect(runwayX+width*.7-markW,y,markW,markH);if(i%5===0){ctx.fillStyle='#e6ebef';ctx.fillRect(runwayX-markW*1.5,y,markW*3,markH*1.4)}}// runway center dashes
for(let i=0;i<20;i++){let f=i/20,y=top+f*(bottom-top),w=2+f*3,h=2+f*8;ctx.fillStyle='#d8e1e8';ctx.fillRect(runwayX-w/2,y,w,h)}
// taxiway curved network, geometric apron
