<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Pilot — Flight Career</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0c1421;color:#e8f1ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#game{height:100dvh;display:flex;flex-direction:column;background:#0b1320}
.top{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#111d2d;border-bottom:1px solid #293b51;z-index:3}
.logo{font-weight:950;letter-spacing:.08em}.logo em{font-style:normal;color:#86e5ac}.stats{display:flex;gap:6px;font-size:12px}.statpill{background:#1b2b40;border:1px solid #32475f;border-radius:20px;padding:5px 8px}
#view{position:relative;flex:1;min-height:0;background:#101c2b;overflow:hidden}canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.hudpanel{background:#101a2ae8;border:1px solid #344960;border-radius:7px;padding:7px 9px;font-size:11px;box-shadow:0 3px 10px #0004}.hudpanel b{font-size:16px}.phase{color:#8be4ad;font-weight:800;letter-spacing:.08em}
.rightHUD{text-align:right}.camera{pointer-events:auto;border:0;background:#273c54;color:white;border-radius:6px;padding:6px 8px}
.bottomHUD{position:absolute;bottom:10px;left:9px;right:9px;display:flex;gap:7px;justify-content:space-between;pointer-events:none}
.bottomHUD .hudpanel{flex:1;text-align:center}.bottomHUD b{font-size:17px}
.nav{height:64px;flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#111d2d;border-top:1px solid #2b4057;z-index:5}
.nav button{border:0;border-radius:0;background:transparent;color:#91a7bf;font-size:11px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav button.active{color:#9ae9b8;background:#1a2c40}.nav .ico{font-size:19px}
.overlay{position:absolute;inset:0;background:#08111d66;display:none;align-items:flex-end;z-index:4}.overlay.open{display:flex}
.sheet{width:100%;max-height:78%;overflow:auto;background:#142238;border:1px solid #344a64;border-radius:16px 16px 0 0;padding:15px 14px 20px;box-shadow:0 -12px 40px #0006}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheethead h2{font-size:17px;margin:0}.close{border:0;background:#263c55;color:#dceaff;border-radius:8px;padding:6px 10px}
.card{border:1px solid #344a62;background:#101b2b;border-radius:11px;padding:11px;margin:8px 0}.muted{color:#95aac1;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.primary{background:#287d57!important;color:white!important;border:1px solid #57b989!important;font-weight:800}.btn{border:1px solid #405974;background:#263b53;color:#e9f2ff;padding:10px 12px;border-radius:9px;font:inherit}.btn:active{filter:brightness(1.2)}.btn:disabled{opacity:.4}.full{width:100%}.select{width:100%;margin:8px 0;background:#233850;color:white;border:1px solid #3b526b;border-radius:9px;padding:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini{background:#1b2a3e;border-radius:8px;padding:8px}.mini small{display:block;color:#91a7bf;font-size:10px}.mini b{font-size:15px}
.tabs{display:flex;gap:7px}.progress{height:7px;background:#33485f;border-radius:10px;overflow:hidden;margin:7px 0}.progress i{display:block;background:#7be2a6;height:100%;width:0}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#102033f2;border:1px solid #52708b;border-radius:10px;padding:12px 16px;display:none;z-index:8;text-align:center;max-width:85%;box-shadow:0 10px 30px #0007}
.logitem{padding:7px 0;border-bottom:1px solid #26394f;font-size:12px;color:#adbed2}
@media(min-width:700px){.sheet{max-width:560px;margin:0 auto 14px;border-radius:16px}.overlay{align-items:center}.top{height:58px}.nav{max-width:800px;width:100%;margin:auto}}
</style></head>
<body>
<div id="game">
<header class="top"><div class="logo">POCKET <em>PILOT</em></div><div class="stats"><span class="statpill">💰 <b id="cash">$2,500</b></span><span class="statpill">✈ <b id="hrs">0.0</b>h</span></div></header>
<div id="view"><canvas id="world"></canvas>
<div class="hud"><div class="hudpanel"><div class="phase" id="phase">ON RAMP · KFRG</div><span id="airportName">Republic Airport</span></div><div class="hudpanel rightHUD"><button class="camera" id="camera">CAM: FOLLOW</button><div style="margin-top:3px"><b id="clock">18:09</b> <span class="muted">LOCAL</span></div></div></div>
<div class="bottomHUD"><div class="hudpanel"><span class="muted">SPEED</span><br><b><span id="speed">0</span> kt</b></div><div class="hudpanel"><span class="muted">ALT</span><br><b><span id="alt">0</span> ft</b></div><div class="hudpanel"><span class="muted">HDG</span><br><b><span id="heading">140</span>°</b></div></div>
<div class="overlay" id="overlay"><div class="sheet"><div class="sheethead"><h2 id="sheetTitle">Menu</h2><button class="close" id="close">✕</button></div><div id="sheetContent"></div></div></div><div id="toast"></div>
</div>
<nav class="nav"><button data-menu="airport" class="active"><span class="ico">🛬</span>Airport</button><button data-menu="jobs"><span class="ico">📋</span>Jobs</button><button data-menu="map"><span class="ico">🗺️</span>Map</button><button data-menu="fleet"><span class="ico">🛩️</span>Fleet</button><button data-menu="career"><span class="ico">🎓</span>Career</button></nav></div>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
let W,H,DPR,mode='airport',sheetOpen=false,camera=0,phase='PARKED',spd=0,alt=0,hdg=140,throttle=0,turn=0,plan=false,ap=false,routeT=0,dest='KISP',cash=2500,hrs=0,flights=0,logs=['Welcome to Republic Airport.'],landed=false,toastTimer;
const airports={KISP:{name:'Long Island MacArthur',nm:18,heading:105},KHPN:{name:'Westchester County',nm:42,heading:315},KJFK:{name:'John F. Kennedy Intl',nm:16,heading:190},KBDR:{name:'Bridgeport',nm:48,heading:330},KBOS:{name:'Boston Logan',nm:145,heading:55},KALB:{name:'Albany Intl',nm:120,heading:330}};
function resize(){let r=$('view').getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}window.addEventListener('resize',resize);resize();
function msg(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',1900)}
function log(s){logs.unshift(s);logs=logs.slice(0,20)}
function planSummary(){let a=airports[dest];return `<div class=\"grid3\"><div class=\"mini\"><small>ROUTE</small><b>KFRG → ${dest}</b></div><div class=\"mini\"><small>DISTANCE</small><b>${a.nm} NM</b></div><div class=\"mini\"><small>ALTITUDE</small><b>3,500 ft</b></div></div><p class=\"muted\">VFR · Estimated ${Math.max(8,Math.round(a.nm/2.5))} min · ${Math.ceil(a.nm/4+4)} gal fuel</p>`}
function ui(){ $('cash').textContent='$'+cash.toLocaleString();$('hrs').textContent=hrs.toFixed(1);$('speed').textContent=Math.round(spd);$('alt').textContent=Math.round(alt);$('heading').textContent=Math.round((hdg+360)%360);
let phaseTxt={PARKED:'ON RAMP',TAXI:'TAXIING',TAKEOFF:'TAKEOFF',CRUISE:'EN ROUTE',APPROACH:'APPROACH',LANDING:'LANDING'}; $('phase').textContent=(phaseTxt[phase]||phase)+' · '+(phase==='CRUISE'?dest:'KFRG');
$('airportName').textContent=phase==='CRUISE'?'Autopilot / real-time route':phase==='APPROACH'||phase==='LANDING'?airports[dest].name:'Republic Airport · Long Island';
$('camera').textContent='CAM: '+['FOLLOW','COCKPIT','MAP'][camera];
}
function menu(m){mode=m;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.menu===m));if(m==='airport'){closeSheet();return}openSheet(m)}
function openSheet(m){sheetOpen=true;$('overlay').classList.add('open');let title='',content='';
if(m==='jobs'){title='Job Board';content=`<p class="muted">Choose a flight contract from your home airport. Complete flights to earn cash and logbook time.</p><div class="card"><div class="row"><b>✈ Scenic / short charter</b><span>+$350–$800</span></div><p class="muted">Beginner-friendly VFR flight. Your first destination is ${airports[dest].name}.</p><button class="btn full primary" onclick="window.planFlight()">Generate flight plan</button></div><div class="card"><b>Available airports</b><select class="select" id="destination">${Object.entries(airports).map(([k,a])=>`<option value="${k}" ${dest===k?'selected':''}>${k} · ${a.name} · ${a.nm} NM</option>`).join('')}</select><button class="btn full" onclick="window.changeDest()">Select destination</button></div><div class="card"><b>Current flight</b><div id="currentPlan">${plan?planSummary():'No plan filed.'}</div><div class="grid3" style="margin-top:8px"><button class="btn" onclick="window.setTurn(-1)">◀ Steer</button><button class="btn primary" onclick="window.setThrottle(1)">Throttle</button><button class="btn" onclick="window.setTurn(1)">Steer ▶</button><button class="btn warn" onclick="window.setThrottle(-1)">Brake</button><button class="btn" onclick="window.rotateAircraft()">Rotate</button><button class="btn" onclick="window.toggleAP()">Autopilot</button></div><button class="btn full primary" style="margin-top:8px" onclick="window.advance()">${phase==='PARKED'?'START TAXI':phase==='TAXI'?'LINE UP / TAKEOFF':phase==='TAKEOFF'?'CLIMB / CRUISE':phase==='CRUISE'?'BEGIN APPROACH':phase==='APPROACH'?'LANDING':'PARK & COMPLETE FLIGHT'}</button></div>`}
if(m==='map'){title='World map';content=`<div class="card"><b>Route overview</b><p class="muted">${plan?'KFRG → '+dest+' · '+airports[dest].nm+' NM':'Plan a flight to show route.'}</p><div style="height:150px;background:#142b3b;border-radius:8px;position:relative;overflow:hidden"><svg viewBox="0 0 320 150" width="100%" height="100%"><path d="M0 90 Q50 40 100 70 T180 35 T320 75 M0 130 Q90 90 160 125 T320 110" fill="none" stroke="#34576b" stroke-width="12"/><path d="M20 35 L80 55 L140 20 L210 45 L300 20" stroke="#203c4b" stroke-width="2" fill="none"/><circle cx="90" cy="100" r="5" fill="#81e6aa"/><circle cx="245" cy="45" r="5" fill="#ffd17b"/><path d="M90 100 Q160 50 245 45" stroke="#8be6ad" stroke-dasharray="5 4" stroke-width="2" fill="none"/></svg></div><button class="btn full" onclick="window.navMenu('jobs')">Open flight planning</button></div><div class="muted">Map view prototype. Route navigation will be expanded to geographic terrain.</div>`}
if(m==='fleet'){title='Hangar';content=`<div class="card"><div class="row"><b>🛩️ Skylark 100</b><span class="lic">Owned</span></div><p class="muted">Single-engine trainer · 2 seats · Cruise 105 kt · Range 450 NM</p><div class="grid3"><div class="mini"><small>CONDITION</small><b>100%</b></div><div class="mini"><small>FUEL</small><b>24 gal</b></div><div class="mini"><small>STATUS</small><b>${phase==='CRUISE'?'Flying':'Ready'}</b></div></div><button class="btn full" onclick="window.toast('Aircraft customization will be added in a later build.')">Customize aircraft</button></div><div class="muted">Aircraft shop and additional planes unlock as your career advances.</div>`}
if(m==='career'){title='Pilot Career';content=`<div class="card"><b>Student Pilot</b><p class="muted">Complete training flights to unlock the Private Pilot License.</p><div class="row"><span>Logged time</span><b>${hrs.toFixed(1)} / 5.0 h</b></div><div class="progress"><i style="width:${Math.min(100,hrs/5*100)}%"></i></div></div><div class="card"><b>Licenses</b><div class="row" style="margin:10px 0"><span>Student</span><span class="lic unlocked">CURRENT</span></div><div class="row"><span>Private Pilot (PPL)</span><span class="lic ${hrs>=5?'unlocked':''}">${hrs>=5?'UNLOCKED':'5 flight hrs + checkride'}</span></div><div class="row" style="margin:10px 0"><span>Instrument Rating</span><span class="lic ${hrs>=25?'unlocked':''}">${hrs>=25?'UNLOCKED':'25 hrs + exam'}</span></div><div class="row"><span>Commercial</span><span class="lic ${hrs>=100?'unlocked':''}">${hrs>=100?'UNLOCKED':'100 hrs + checkride'}</span></div><div class="row" style="margin:10px 0"><span>Multi-engine</span><span class="lic ${hrs>=40?'unlocked':''}">${hrs>=40?'UNLOCKED':'40 hrs + training'}</span></div></div><div class="card"><b>Logbook</b><div class="row"><span>Flights completed</span><b>${flights}</b></div><div class="row"><span>Total time</span><b>${hrs.toFixed(1)} h</b></div><button class="btn full" style="margin-top:8px" onclick="window.showLog()">View flight log</button></div>`}
$('sheetTitle').textContent=title;$('sheetContent').innerHTML=content}
function closeSheet(){sheetOpen=false;$('overlay').classList.remove('open');mode='airport';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.menu==='airport'))}
$('close').onclick=closeSheet;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSheet()});
window.planFlight=()=>{plan=true;let a=airports[dest];log('Flight plan generated: KFRG → '+dest+' · '+a.nm+' NM VFR');msg('Flight plan ready');openSheet('jobs')};
window.changeDest=()=>{let sel=$('destination');if(sel)dest=sel.value;plan=false;msg('Destination set: '+dest);openSheet('jobs')};
window.navMenu=menu;window.toast=msg;window.showLog=()=>{openSheet('career');$('sheetContent').innerHTML='<h3>Flight log</h3>'+logs.map(s=>`<div class="logitem">${s}</div>`).join('')};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>menu(b.dataset.menu));
$('camera').onclick=()=>{camera=(camera+1)%3;ui()};
function advance(){if(phase==='PARKED'){if(!plan){msg('Choose a job and generate a flight plan first.');menu('jobs');return}phase='TAXI';log('Taxi clearance: taxi to runway 14.');msg('Taxi: follow taxiway to runway');}
else if(phase==='TAXI'){if(spd<5){msg('Taxi forward first. Use throttle.');return}phase='TAKEOFF';spd=0;log('At runway 14. Takeoff roll.');msg('Runway 14 · Takeoff');}
else if(phase==='TAKEOFF'){if(spd<50){msg('Accelerate to 55 kt before rotate.');return}phase='CRUISE';alt=3500;spd=105;routeT=0;log('Airborne. Climb to cruise altitude. Engage autopilot for route.');msg('Airborne! Autopilot available');}
else if(phase==='CRUISE'){phase='APPROACH';ap=false;alt=1500;spd=90;log('Approach phase: take control for arrival.');msg('Approach · take control');}
else if(phase==='APPROACH'){phase='LANDING';alt=180;spd=65;log('Final approach. Align and flare.');msg('Landing phase');}
else if(phase==='LANDING'){if(spd>20){msg('Slow below 20 kt before parking. Brake.');return}phase='PARKED';spd=0;alt=0;cash+=500+airports[dest].nm*4;hrs+=Math.max(.25,airports[dest].nm/65);flights++;plan=false;ap=false;log('Flight completed and logged · payment credited.');msg('Flight complete! Payment + logbook time');}
ui();if(mode!=='airport'&&sheetOpen)openSheet(mode)}
window.advance=advance;
function toggleAP(){if(phase!=='CRUISE'&&phase!=='APPROACH'){msg('Autopilot only available airborne');return}ap=!ap;msg(ap?'Autopilot engaged · real-time flight':'Autopilot disengaged');log(ap?'Autopilot engaged.':'Autopilot disengaged.');}
window.toggleAP=toggleAP;
function draw(){
ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0c1930');sky.addColorStop(.45,'#17283b');sky.addColorStop(1,'#0d1b28');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
let horizon=H*.33;
// pixel city glowing skyline/grid
for(let i=0;i<950;i++){let x=(i*97.17%W),y=(i*53.21%Math.max(1,horizon));let alpha=.28+.65*Math.abs(Math.sin(i*1.1));ctx.fillStyle=i%5===0?`rgba(255,196,105,${alpha})`:`rgba(244,210,137,${alpha*.6})`;ctx.fillRect(Math.floor(x),Math.floor(y),i%11===0?2:1.5,1.5)}
ctx.fillStyle='#15252b';ctx.beginPath();ctx.moveTo(0,horizon);for(let x=0;x<=W;x+=20)ctx.lineTo(x,horizon+Math.sin(x*.028)*8+Math.cos(x*.07)*4);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
// tile-ish grass patchwork
for(let i=0;i<55;i++){let x=(i*127%W),y=horizon+((i*71)%(H-horizon));ctx.fillStyle=i%2?'#1a302d':'#203632';ctx.fillRect(x,y,25+(i%5)*9,14+(i%4)*7)}
// airport local perspective
const cx=W*.5, ry=H*.44, rw=Math.max(22,W*.085), bottom=H*1.06;
ctx.fillStyle='#293444';ctx.beginPath();ctx.moveTo(cx-rw*.13,ry);ctx.lineTo(cx+rw*.13,ry);ctx.lineTo(cx+rw,bottom);ctx.lineTo(cx-rw,bottom);ctx.closePath();ctx.fill();
ctx.strokeStyle='#778699';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-rw*.13,ry);ctx.lineTo(cx-rw,bottom);ctx.moveTo(cx+rw*.13,ry);ctx.lineTo(cx+rw,bottom);ctx.stroke();
for(let i=0;i<38;i++){let f=i/38,y=ry+f*(bottom-ry),xw=rw*f;ctx.fillStyle=i%4===0?'#dce7ef':'#ffc86d';ctx.fillRect(cx-xw-2,y,2,2);ctx.fillRect(cx+xw,y,2,2);if(i%6===0){ctx.fillStyle='#e7edf2';ctx.fillRect(cx-2,y,4,Math.max(2,f*6))}}
// taxiways, wide perspective polygon paths
ctx.strokeStyle='#293746';ctx.lineWidth=Math.max(7,W*.025);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-rw*.55,bottom*.83);ctx.lineTo(W*.18,H*.78);ctx.lineTo(W*.12,H*.67);ctx.lineTo(cx-rw*.6,H*.63);ctx.moveTo(cx+rw*.65,H*.65);ctx.lineTo(W*.85,H*.59);ctx.lineTo(W*.93,H*.8);ctx.lineTo(cx+rw*.5,bottom*.84);ctx.stroke();
ctx.strokeStyle='#496274';ctx.lineWidth=1;ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(cx-rw*.55,bottom*.83);ctx.lineTo(W*.18,H*.78);ctx.lineTo(W*.12,H*.67);ctx.lineTo(cx-rw*.6,H*.63);ctx.stroke();ctx.setLineDash([]);
// apron and terminal lit windows
ctx.fillStyle='#263747';ctx.fillRect(W*.1,H*.59,W*.2,10);ctx.fillStyle='#e9bd6d';for(let i=0;i<24;i++)ctx.fillRect(W*.11+i*W*.0075,H*.59+2,2,4);
for(let i=0;i<21;i++){let x=i*W/21+4,y=H*.55+(i*43%Math.max(30,H*.34));if(x>W*.37&&x<W*.65)continue;ctx.fillStyle='#293d4b';ctx.fillRect(x,y,9+(i%3)*5,5+(i%2)*3);ctx.fillStyle='#f6c36d';ctx.fillRect(x+2,y+2,2,2)}
// car dots animate along roads
for(let i=0;i<24;i++){let x=(i*53+performance.now()*.015*(i%2?1:-1))%W;let y=H*.77+Math.sin(i*.5)*H*.055;ctx.fillStyle=i%3===0?'#ffcb75':'#a7d9ff';ctx.fillRect(x,y,2.5,2)}
// Aircraft
let px=W*.25,py=H*.65;if(phase==='TAXI'){px=W*.3+Math.min(spd*2,W*.15);py=H*.68}if(phase==='TAKEOFF'){px=cx;py=H*.68-alt*.035}if(phase==='CRUISE'||phase==='APPROACH'){px=W*.52+Math.sin(performance.now()*.0003)*W*.14;py=H*.4+Math.sin(performance.now()*.0005)*H*.04}if(phase==='LANDING'){px=cx;py=H*.58}
ctx.save();ctx.translate(px,py);ctx.rotate((hdg-140)*Math.PI/180);ctx.fillStyle='#d8e5ed';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(2,-2);ctx.lineTo(12,2);ctx.lineTo(12,4);ctx.lineTo(2,3);ctx.lineTo(4,9);ctx.lineTo(1,9);ctx.lineTo(-2,3);ctx.lineTo(-12,4);ctx.lineTo(-12,2);ctx.lineTo(-2,-2);ctx.closePath();ctx.fill();ctx.fillStyle='#ff615e';ctx.fillRect(-2,-7,4,3);ctx.fillStyle='#65dbff';ctx.fillRect(-2,4,2,2);ctx.restore();
if(camera===1){ctx.fillStyle='#101b2bdc';ctx.fillRect(0,H*.72,W,H*.28);ctx.strokeStyle='#61768d';ctx.strokeRect(W*.1,H*.74,W*.8,H*.2);ctx.fillStyle='#dcecff';ctx.font='12px monospace';ctx.fillText('COCKPIT · BASIC INSTRUMENT VIEW',W*.14,H*.78);ctx.fillText('IAS '+Math.round(spd)+' KT · ALT '+Math.round(alt)+' FT · HDG '+Math.round(hdg),W*.14,H*.84)}
if(camera===2){ctx.fillStyle='#11202dd9';ctx.fillRect(10,45,W-20,H-95);ctx.strokeStyle='#53718a';ctx.strokeRect(10,45,W-20,H-95);ctx.fillStyle='#8be6ad';ctx.font='12px monospace';ctx.fillText('AIRPORT MAP · KFRG',22,63)}
}
let prev=performance.now();
function frame(now){let dt=Math.min(.04,(now-prev)/1000);prev=now;
if(phase==='TAXI'){spd=Math.max(0,Math.min(18,spd+throttle*8*dt));hdg+=turn*17*dt}
if(phase==='TAKEOFF'){spd=Math.max(0,Math.min(120,spd+Math.max(0,throttle)*17*dt));hdg+=turn*4*dt}
if(phase==='CRUISE'&&!ap){spd=Math.max(65,Math.min(125,spd+throttle*5*dt));hdg+=turn*7*dt}
if(phase==='CRUISE'&&ap){routeT+=dt;spd=105;hdg=airports[dest].heading;alt=3500;if(routeT>Math.max(22,airports[dest].nm*1.3)){phase='APPROACH';ap=false;alt=1500;spd=90;log('Autopilot reached destination. Manual approach required.');msg('Arrival · take controls')}}
if(phase==='APPROACH'){spd=Math.max(50,Math.min(100,spd+throttle*5*dt));hdg+=turn*6*dt;if(!ap)alt=Math.max(200,alt+throttle*22*dt)}
if(phase==='LANDING'){spd=Math.max(0,Math.min(75,spd+throttle*5*dt));alt=Math.max(0,alt-16*dt);hdg+=turn*2*dt}
if(throttle<0)spd=Math.max(0,spd-12*dt);if(phase==='PARKED')spd=0;
ui();draw();requestAnimationFrame(frame)}
// tap controls overlay buttons exposed in the jobs/flight actions sheet, so world stays uncluttered
window.flightControls=()=>{openSheet('controls')};
const originalOpen=openSheet;
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')throttle=1;if(k==='s'||k==='arrowdown')throttle=-1;if(k==='a'||k==='arrowleft')turn=-1;if(k==='d'||k==='arrowright')turn=1;if(k===' '){if(phase==='TAKEOFF'&&spd>50){phase='CRUISE';alt=3500;spd=105;msg('Rotate · airborne!')}else if(phase==='LANDING'){alt=0;spd=Math.max(0,spd-3)}}if(k==='p')toggleAP()});
window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['w','arrowup','s','arrowdown'].includes(k))throttle=0;if(['a','arrowleft','d','arrowright'].includes(k))turn=0});
function controlsMenu(){openSheet('controls');$('sheetTitle').textContent='Aircraft controls';$('sheetContent').innerHTML=`<div class="card"><div class="muted">Flight phase: ${phase}</div><div class="grid3"><button class="btn" onclick="window.setTurn(-1)">◀ Turn left</button><button class="btn primary" onclick="window.setThrottle(1)">▲ Throttle</button><button class="btn" onclick="window.setTurn(1)">Turn right ▶</button><button class="btn warn" onclick="window.setThrottle(-1)">▼ Brake</button><button class="btn" onclick="window.rotateAircraft()">ROTATE</button><button class="btn" onclick="window.toggleAP()">AUTOPILOT</button></div><button class="btn full primary" style="margin-top:9px" onclick="window.advance()">NEXT FLIGHT PHASE</button><p class="muted">Touch buttons toggle power/steering on and off · Keyboard WASD/arrows · Space rotate · P autopilot</p></div>`}
window.setThrottle=v=>{throttle=(throttle===v?0:v);if(throttle!==0)turn=0;};window.setTurn=v=>{turn=(turn===v?0:v);if(turn!==0)throttle=0;};window.rotateAircraft=()=>{if(phase==='TAKEOFF'&&spd>=50){phase='CRUISE';alt=3500;spd=105;log('Rotated, airborne.')}else if(phase==='APPROACH'){alt=Math.max(200,alt-100)}else if(phase==='LANDING'){alt=0;spd=Math.max(0,spd-3)}else msg('Rotate at takeoff speed');ui()};
ui();draw();requestAnimationFrame(frame);
