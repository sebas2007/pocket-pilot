<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Pilot 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111923;color:#eef4fb;font-family:Inter,system-ui,sans-serif}#scene{position:absolute;inset:0}canvas{display:block}.ui{position:absolute;inset:0;pointer-events:none}.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:12px}.brand{display:flex;align-items:center;gap:10px;background:#17222dbd;border:1px solid #ffffff20;backdrop-filter:blur(14px);padding:10px 14px;border-radius:15px;box-shadow:0 8px 24px #0003}.brand-icon{width:35px;height:35px;border-radius:10px;background:linear-gradient(145deg,#58b7ef,#2575c5);display:grid;place-items:center;font-size:18px}.brand b{font-size:13px;letter-spacing:.07em}.brand small{display:block;color:#a6bbce;font-size:10px;margin-top:2px}.righttop{display:flex;gap:8px;align-items:center}.pill{border:1px solid #ffffff25;background:#152330c9;backdrop-filter:blur(12px);border-radius:12px;padding:10px 12px;font-size:12px;color:#dce9f5}.pill strong{color:#fff}.button{pointer-events:auto;cursor:pointer;border:1px solid #ffffff24;background:#192b3ad9;color:#f3f7fb;border-radius:12px;padding:10px 14px;font:600 12px Inter;transition:.16s}.button:hover{background:#28445c;transform:translateY(-1px)}.button.primary{background:#277ec4;border-color:#4a9ed9}.button.active{background:#387bb1}.bottom{position:absolute;bottom:18px;left:18px;right:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.panel{pointer-events:auto;background:linear-gradient(160deg,#142331e8,#101b27e8);border:1px solid #ffffff20;backdrop-filter:blur(16px);box-shadow:0 12px 35px #0004;border-radius:17px;padding:14px}.flight-panel{width:min(390px,100%)}.panel-title{font-size:10px;letter-spacing:.14em;color:#9cb4c9;font-weight:700;text-transform:uppercase;margin-bottom:9px}.flightrow{display:flex;align-items:center;justify-content:space-between}.flightrow h2{font:800 26px 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.02em}.flightrow span{font-size:11px;color:#a9c0d3}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{padding:9px;background:#ffffff08;border:1px solid #ffffff0b;border-radius:10px}.stat label{display:block;font-size:9px;color:#91a8bc;letter-spacing:.1em}.stat b{font:700 18px 'Barlow Condensed',sans-serif;display:block;margin-top:3px}.stat small{font-size:10px;color:#a8bdce}.controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:450px}.controls .button{min-width:82px}.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:190px;background:#10202bd0;border:1px solid #ffffff20;border-radius:10px;padding:8px 12px;color:#c9d9e6;font-size:11px;pointer-events:none;white-space:nowrap}.side{position:absolute;left:18px;top:84px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}.side .button{width:110px;text-align:left}.menu{position:absolute;top:84px;left:138px;width:260px;max-height:70vh;overflow:auto;display:none;pointer-events:auto}.menu.open{display:block}.menu h3{margin:0 0 12px;font-size:14px}.menuitem{padding:10px;border-radius:10px;background:#ffffff08;border:1px solid #ffffff0b;margin:6px 0;font-size:12px;cursor:pointer}.menuitem:hover{background:#ffffff14}.menuitem small{display:block;color:#9fb4c7;margin-top:3px}.notice{position:absolute;top:80px;left:50%;transform:translateX(-50%);padding:10px 14px;background:#132536e8;border:1px solid #ffffff24;border-radius:12px;font-size:12px;display:none;pointer-events:none}.notice.show{display:block}.mobilehide{display:block}@media(max-width:700px){.top{padding:10px}.brand{padding:8px 10px}.brand small{display:none}.pill{padding:8px 9px;font-size:10px}.side{top:72px;left:10px}.side .button{width:90px;padding:9px;font-size:11px}.menu{left:108px;top:72px;width:min(240px,60vw)}.bottom{left:10px;right:10px;bottom:10px;align-items:flex-end}.flight-panel{width:min(330px,65vw);padding:10px}.flightrow h2{font-size:22px}.stats{gap:4px}.stat{padding:7px}.stat b{font-size:16px}.controls{max-width:140px;gap:5px}.controls .button{min-width:0;padding:9px 10px;font-size:10px}.hint{bottom:160px;font-size:10px}.righttop .pill:nth-child(2){display:none}}
</style></head><body><div id="scene"></div><div class="ui">
<div class="top"><div class="brand"><div class="brand-icon">✈</div><div><b>POCKET PILOT</b><small>3D AIRPORT · FREE ROAM</small></div></div><div class="righttop"><div class="pill">✦ <strong>1,240</strong> credits</div><div class="pill">✈ <strong>PA-28</strong> · N960WC</div><button class="button" id="cameraBtn">CAMERA: ORBIT</button></div></div>
<div class="side"><button class="button" data-menu="airport">▦ Airport</button><button class="button" data-menu="flight">✈ Flight</button><button class="button" data-menu="fleet">▤ Fleet</button><button class="button" data-menu="career">★ Career</button></div>
<div class="menu panel" id="menu"><div id="menuContent"></div></div><div class="notice" id="notice"></div>
<div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
<div class="bottom"><div class="panel flight-panel"><div class="panel-title">Current aircraft · Ramp 04</div><div class="flightrow"><h2>CESSNA 172 SKYHAWK</h2><span>READY</span></div><div class="stats"><div class="stat"><label>ALTITUDE</label><b id="alt">0 <small>FT</small></b></div><div class="stat"><label>AIRSPEED</label><b id="speed">0 <small>KT</small></b></div><div class="stat"><label>ENGINE</label><b id="engine">OFF</b></div></div></div><div class="controls"><button class="button" id="engineBtn">ENGINE</button><button class="button" id="taxiBtn">TAXI</button><button class="button primary" id="takeoffBtn">TAKEOFF</button><button class="button" id="resetBtn">RESET</button></div></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec7e3);scene.fog=new THREE.Fog(0x9ec7e3,450,1500);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,2500);camera.position.set(110,115,175);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.getElementById('scene').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=35;controls.maxDistance=600;
scene.add(new THREE.HemisphereLight(0xd9efff,0x647344,2.0));const sun=new THREE.DirectionalLight(0xffe6c3,3.0);sun.position.set(-140,200,90);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-250;sun.shadow.camera.right=250;sun.shadow.camera.top=250;sun.shadow.camera.bottom=-250;scene.add(sun);
const mat=(c,rough=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});const grass=mat(0x70935b),concrete=mat(0x777e83),taxiMat=mat(0x656c72),white=mat(0xf4f1e7),yellow=mat(0xf5c544),dark=mat(0x25343e),glass= new THREE.MeshStandardMaterial({color:0x91b9cc,roughness:.22,metalness:.25}),roof=mat(0x4b5961),red=mat(0xc84136),blue=mat(0x2976bd);
function box(parent,w,h,d,m,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
function plane(w,d,m,x=0,z=0){let o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);o.rotation.x=-Math.PI/2;o.position.set(x,-.15,z);o.receiveShadow=true;scene.add(o);return o}
plane(1400,1400,grass);
// airport apron + taxiway network
plane(360,250,concrete,0,20);plane(32,500,taxiMat,0,-90);plane(100,45,taxiMat,0,-260);plane(100,45,taxiMat,0,190);plane(40,70,taxiMat,-120,-120);plane(40,70,taxiMat,120,-120);plane(35,55,taxiMat,-140,80);plane(35,55,taxiMat,140,80);
// Runway long axis north-south, beyond apron
plane(42,440,mat(0x343a3e),0,-410);plane(55,460,mat(0x555c60),0,-410); // shoulder
// runway center and threshold markings
for(let z=-615;z<-205;z+=28)box(scene,1,.06,16,white,0,.02,z);
for(let side of [-1,1]){for(let i=0;i<8;i++)box(scene,1.8,.06,18,white,side*13,.03,-625+i*2.5);for(let z=-615;z<-210;z+=40){box(scene,.4,.06,1,white,side*19,.03,z)}}
// Taxi centerline dashes
for(let z=-285;z<165;z+=18)box(scene,.5,.07,7,yellow,0,.05,z);
// apron stand lines and parking markings
for(let x of [-95,-55,55,95]){box(scene,.5,.05,38,yellow,x,.05,15);box(scene,22,.05,.5,yellow,x,.05,34);box(scene,22,.05,.5,yellow,x,.05,-4)}
// light arrays
function light(x,z,color=0xffffff){let mesh=new THREE.Mesh(new THREE.SphereGeometry(.7,8,8),new THREE.MeshBasicMaterial({color}));mesh.position.set(x,1,z);scene.add(mesh)}
for(let z=-630;z<-190;z+=20){light(-26,z,0xffffff);light(26,z,0xffffff)}for(let z=-300;z<180;z+=22){light(-17,z,0x44dd77);light(17,z,0x44dd77)}
// terminal complex
box(scene,100,13,34,mat(0xb8c2c7),-175,6.5,40);box(scene,106,2,38,roof,-175,14,40);box(scene,92,7,2,glass,-175,7,22);for(let x=-215;x<-135;x+=12)box(scene,2,8,2,mat(0x637d8d),x,7,22);
// terminal wing + jet bridges
for(let x of [-215,-195,-155,-135]){let jet=box(scene,8,5,12,mat(0xc7cdd0),x,5,7);box(scene,5,4,5,glass,x,6,0)}
// hangars and service buildings
function hangar(x,z,w,d){box(scene,w,15,d,mat(0xd0d3d1),x,7.5,z);box(scene,w+2,2,d+2,roof,x,16,z);box(scene,w*.65,12,1,mat(0x9da8ae),x,6,z-d/2-.55);box(scene,w*.65,11,1,glass,x,5.8,z-d/2-.8)}hangar(205,15,65,48);hangar(230,-80,52,42);hangar(-245,-55,60,48);
// tower
box(scene,0,25,12,mat(0xd8d8ce),-250,12.5,90);box(scene,20,6,18,glass,-250,28,90);box(scene,23,1.5,21,roof,-250,32,90);box(scene,7,8,7,mat(0xd5d5cf),-250,37,90);
// ground objects/trees scattered
for(let i=0;i<150;i++){let x=(Math.random()-.5)*900,z=(Math.random()-.5)*900;if(Math.abs(x)<190&&z>-650&&z<200)continue;let trunk=box(scene,1.5,5,1.5,mat(0x68503b),x,2.5,z);let crown=new THREE.Mesh(new THREE.ConeGeometry(5,12,7),mat(0x446f42));crown.position.set(x,10,z);crown.castShadow=true;scene.add(crown)}
// aircraft model with nose facing +Z
function makePlane(livery=0xffffff){const g=new THREE.Group();const fus= new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.15,14,12),mat(livery));fus.rotation.x=Math.PI/2;fus.position.z=0;fus.castShadow=true;g.add(fus);const nose=new THREE.Mesh(new THREE.ConeGeometry(1.2,3.4,12),mat(0xf0f0ed));nose.rotation.x=Math.PI/2;nose.position.z=8.3;g.add(nose);const wing=box(g,27,.42,4.5,mat(0xe7e7e0),0,.1,0);wing.position.y=.3;const tail=box(g,9,.35,3.2,mat(0xe7e7e0),0,.2,-5.8);box(g,1.1,4.2,2.2,mat(0xe7e7e0),0,2,-6.5);box(g,4,.3,2,mat(0xd2d8db),0,1,-6.5); // windows
for(let side of [-1,1])for(let i=0;i<5;i++){let win=new THREE.Mesh(new THREE.BoxGeometry(.16,.42,.55),glass);win.position.set(side*1.25,.55,4.8-i*1.65);g.add(win)}
// struts + wheels
for(let side of [-1,1]){let str=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2.6,8),dark);str.position.set(side*4,-1.1,1);g.add(str);let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.3,12),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(side*4,-2.3,1);g.add(wheel)}let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.28,12),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(0,-2.1,7);g.add(wheel);
// propeller
const hub=new THREE.Mesh(new THREE.SphereGeometry(.35,12,12),dark);hub.position.z=10.5;g.add(hub);const prop=new THREE.Group();prop.position.z=10.7;for(let i=0;i<2;i++){let blade=box(prop,.35,4,.35,dark,0,0,0);blade.position.y=2;blade.rotation.z=i*Math.PI;}g.add(prop);g.userData.prop=prop;return g}
const player=makePlane(0xecebe4);player.position.set(-65,2.4,15);player.rotation.y=Math.PI/2;scene.add(player);
// parked aircraft variety
for(let i=0;i<5;i++){let p=makePlane(i%2?0xffffff:0xbfd5e5);p.scale.setScalar(i<3?.65:.8);p.position.set(-100+i*48,1.7,25+(i%2)*17);p.rotation.y=Math.PI/2+(i%2)*.2;scene.add(p)}
// animated service carts
const carts=[];for(let i=0;i<7;i++){let c=new THREE.Group();box(c,4,1.5,6,mat(i%2?0xe1b443:0xd7e0e3),0,1,0);for(let x of [-1.5,1.5])for(let z of [-2,2]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.3,8),dark);w.rotation.z=Math.PI/2;w.position.set(x,.3,z);c.add(w)}c.position.set(-160+i*50,0,65+Math.random()*12);scene.add(c);carts.push(c)}
let engine=false,taxiOn=false,flying=false,camMode=0;let phase=0;const cameraModes=['ORBIT','FOLLOW','COCKPIT','TOWER'];function notify(s){const n=document.getElementById('notice');n.textContent=s;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2100)}
function toggleMenu(name){const menu=document.getElementById('menu');if(menu.classList.contains('open')&&menu.dataset.name===name){menu.classList.remove('open');return}menu.dataset.name=name;menu.classList.add('open');let content={airport:`<h3>Airport · KPVL</h3><div class="menuitem">Pine Valley Regional<small>Elevation 412 ft · 2 runways · Class D</small></div><div class="menuitem">Runway 18 / 36<small>5,200 × 100 ft · Asphalt</small></div><div class="menuitem">Weather<small>Clear skies · Wind 240° at 4 kt · 18°C</small></div>`,flight:`<h3>Flight operations</h3><div class="menuitem" id="mstart">Start engine<small>Checklist · fuel · ignition</small></div><div class="menuitem" id="mtaxi">Request taxi<small>Taxi to runway 18</small></div><div class="menuitem" id="mroute">Flight plan<small>KPVL → KORF · 42 NM</small></div>`,fleet:`<h3>Hangar · Fleet</h3><div class="menuitem">Cessna 172 Skyhawk<small>N960WC · Available · 4 seats</small></div><div class="menuitem">Piper PA-28 Archer<small>Locked · 3 flight hours required</small></div><div class="menuitem">Beechcraft Bonanza<small>Locked · 12,000 credits</small></div>`,career:`<h3>Pilot career</h3><div class="menuitem">Student pilot<small>0.0 / 10 hours · 0 landings</small></div><div class="menuitem">Next milestone<small>Complete 3 circuits and landings</small></div><div class="menuitem">Logbook<small>Flights · hours · achievements</small></div>`};document.getElementById('menuContent').innerHTML=content[name];document.querySelectorAll('.menuitem').forEach(el=>el.onclick=()=>{if(el.id==='mstart')startEngine();else if(el.id==='mtaxi')taxi();else if(el.id==='mroute')notify('Flight plan opened · KPVL → KORF');else notify(el.textContent.trim())})}
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>toggleMenu(b.dataset.menu));function startEngine(){engine=!engine;document.getElementById('engine').textContent=engine?'RUNNING':'OFF';document.getElementById('engineBtn').classList.toggle('active',engine);notify(engine?'Engine started · 1,000 RPM':'Engine shut down')}
function taxi(){if(!engine){notify('Start engine first');return}taxiOn=!taxiOn;notify(taxiOn?'Taxi clearance · follow yellow line':'Taxi stopped');}
document.getElementById('engineBtn').onclick=startEngine;document.getElementById('taxiBtn').onclick=taxi;document.getElementById('takeoffBtn').onclick=()=>{if(!engine){notify('Start engine before takeoff');return}flying=!flying;phase=flying?1:0;notify(flying?'Takeoff roll · rotate at 55 kt':'Returning to ground mode')};document.getElementById('resetBtn').onclick=()=>{player.position.set(-65,2.4,15);player.rotation.y=Math.PI/2;flying=false;taxiOn=false;notify('Aircraft reset to parking stand')};document.getElementById('cameraBtn').onclick=()=>{camMode=(camMode+1)%4;document.getElementById('cameraBtn').textContent='CAMERA: '+cameraModes[camMode];notify('Camera · '+cameraModes[camMode])};
let t=0;function animate(){requestAnimationFrame(animate);t+=.016;controls.update();if(engine)player.userData.prop.rotation.z+=.5;if(taxiOn&&!flying){player.position.z-=.08;player.position.x+=.025;player.rotation.y=Math.PI/2;}if(flying){player.position.z-=.5;player.position.y=Math.min(40,player.position.y+.055);document.getElementById('speed').innerHTML='58 <small>KT</small>';document.getElementById('alt').innerHTML=Math.round(player.position.y*18)+' <small>FT</small>'}else{document.getElementById('speed').innerHTML=taxiOn?'8 <small>KT</small>':'0 <small>KT</small>';document.getElementById('alt').innerHTML='0 <small>FT</small>'}carts.forEach((c,i)=>{c.position.x+=Math.sin(t*.3+i)*.012;c.position.z+=Math.cos(t*.3+i)*.012});if(camMode===1){camera.position.lerp(new THREE.Vector3(player.position.x+35,player.position.y+22,player.position.z+40),.025);controls.target.lerp(player.position,.04)}else if(camMode===2){camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+3,player.position.z+9),.05);controls.target.lerp(new THREE.Vector3(player.position.x,player.position.y+1,player.position.z-25),.05)}else if(camMode===3){camera.position.lerp(new THREE.Vector3(-250,85,90),.02);controls.target.lerp(new THREE.Vector3(-80,0,0),.03)}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
